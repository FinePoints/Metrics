<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Metrics</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Slide Metrics">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
:root {
  --walmart-navy: #002244;
  --walmart-blue: #0071ce;
  --walmart-yellow: #ffc220;
}

[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background-color: #f4f6f8;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}

.install-banner {
  display: flex;
  width: 100%;
  border: 0;
  background: #1ae81a;
  color: var(--walmart-navy);
  padding: 12px 20px;
  font: bold 16px inherit;
  cursor: pointer;
  justify-content: center;
  align-items: center;
  gap: 8px;
  box-sizing: border-box;
  box-shadow: 0 2px 4px rgba(0,0,0,.1);
}
.install-banner[hidden] { display: none; }

/* Navbar */
.toolbar {
  width: 100%;
  background: var(--walmart-blue);
  padding: 0 20px;
  height: 65px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-sizing: border-box;
  box-shadow: 0 4px 8px rgba(0,0,0,.2);
  z-index: 10;
}
.toolbar-logo { height: 45px; width: auto; object-fit: contain; }

/* Hidden-ish fallback upload */
.bottom-upload-container {
  margin: 10px auto 20px;
  display: flex;
  justify-content: center;
  width: 100%;
  opacity: .3;
  transition: opacity .3s ease;
}
.bottom-upload-container:hover,
.bottom-upload-container:focus-within { opacity: 1; }
input[type="file"] { font-size: 14px; cursor: pointer; }

/* 16:9 slide container */
.responsive-viewer { width: 100%; overflow-x: auto; display: flex; justify-content: center; }
.container {
  position: relative;
  width: 100%;
  max-width: 1920px;
  aspect-ratio: 16 / 9;
  margin: 20px auto;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
  background: #fff;
  overflow: hidden;
}
.bg-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: fill;
  z-index: 0;
  display: block;
}

/* Fulfillment grids */
.dashboard-grid {
  position: absolute;
  top: 35.5%;
  width: 43.2%;
  height: 53%;
  display: grid;
  grid-template-columns: repeat(3, 32.407%);
  grid-template-rows: repeat(3, 26.415%);
  justify-content: space-between;
  align-content: space-between;
  z-index: 2;
}
.left-side { left: 4.1%; }
.right-side { right: 4.1%; }
.graph-cell {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}
.graph-cell svg { width: 100%; height: 100%; overflow: visible; }

/* Controls */
.controls-container {
  width: 100%;
  max-width: 900px;
  margin: 20px auto;
  padding: 0 15px 20px;
  box-sizing: border-box;
}
.panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 15px;
  background: #fff;
  padding: 16px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  box-shadow: 0 4px 6px rgba(0,0,0,.05);
}
.panel-row { display: flex; justify-content: space-between; align-items: center; }
.panel-row label { font-weight: bold; color: var(--walmart-navy); font-size: 16px; }
.panel-row input,
.panel-row select {
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-weight: bold;
  font-size: 14px;
  box-sizing: border-box;
}
.panel-row select { cursor: pointer; color: var(--walmart-navy); background: #f8f9fa; }
.export-btn {
  width: 100%;
  background: var(--walmart-yellow);
  color: #000;
  border: none;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color .2s;
}
.export-btn:hover { background: #e3a918; }
.export-btn:disabled { opacity: .6; cursor: wait; }

details {
  background: #fff;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  margin-bottom: 15px;
  box-shadow: 0 4px 6px rgba(0,0,0,.05);
  overflow: hidden;
}
summary {
  background: var(--walmart-blue);
  color: #fff;
  padding: 16px 20px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  list-style: none;
}
summary::-webkit-details-marker { display: none; }
summary::after { content: '▼'; font-size: 14px; transition: transform .2s ease-in-out; }
details[open] summary::after { transform: rotate(180deg); }

.controls-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 15px;
  background: #fafafa;
}
.controls-grid.assoc-grid {
  grid-template-rows: repeat(5, auto);
  grid-auto-flow: column;
  gap: 15px;
}
@media (min-width: 600px) {
  .controls-grid:not(.assoc-grid) {
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    padding: 20px;
  }
}
.control-group { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.control-group label { font-size: 13px; font-weight: bold; color: var(--walmart-navy); }
.control-group input,
.control-group select {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
  background: #fff;
  box-sizing: border-box;
  transition: border-color .2s, box-shadow .2s;
  width: 100%;
}
.control-group input:focus,
.control-group select:focus {
  outline: none;
  border-color: var(--walmart-blue);
  box-shadow: 0 0 0 2px rgba(0,113,206,.2);
}
.control-group input:read-only { background: #e9ecef; cursor: not-allowed; }
.input-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
.input-wrapper input { padding-right: 30px; }
.input-wrapper.has-prefix input { padding-left: 25px; padding-right: 10px; }
.input-prefix, .input-suffix {
  position: absolute;
  color: #666;
  font-weight: bold;
  pointer-events: none;
}
.input-prefix { left: 12px; }
.input-suffix { right: 12px; }
.stack { display: flex; flex-direction: column; gap: 6px; }

/* Department */
.dept-grid {
  position: absolute;
  top: 22%;
  left: 4%;
  width: 42%;
  height: 68%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 1%;
  z-index: 2;
}
.dept-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  font-family: Arial, sans-serif;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
}
.dept-card-title {
  font-size: 1.2em;
  font-weight: bold;
  color: var(--walmart-navy);
  flex: 0 0 45%;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 4%;
  box-sizing: border-box;
}
.dept-card-value {
  flex: 1;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  font-size: 3.5em;
  color: #041e42;
}

/* Week label */
.week-display {
  position: absolute;
  bottom: -0.5%;
  left: 2.5%;
  color: var(--walmart-navy);
  font-size: 2.5em;
  font-family: 'Bogle', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 900;
  z-index: 5;
  white-space: nowrap;
}
.fy-date-sub { font-size: .48em; font-weight: 700; margin-left: 8px; opacity: .9; }

/* Associates */
.assoc-header {
  position: absolute;
  top: 22.2%;
  left: 3.5%;
  width: 58.5%;
  height: 6.5%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 2.6em;
  font-weight: bold;
  z-index: 2;
}
.assoc-box {
  position: absolute;
  z-index: 2;
  display: flex;
  flex-direction: column;
  padding: 1.5%;
  box-sizing: border-box;
}
.assoc-box-title {
  text-align: center;
  font-weight: bold;
  font-size: 1.8em;
  color: var(--walmart-navy);
  margin-bottom: 5%;
  border-bottom: 2px solid #e0e0e0;
  padding-bottom: 4%;
}
.assoc-list { display: flex; flex-direction: column; flex: 1; justify-content: space-evenly; gap: 2%; }
.box-stagers .assoc-list,
.box-preppers .assoc-list { gap: 10%; justify-content: flex-start; }
.assoc-row { display: flex; justify-content: space-between; font-size: 1.4em; font-weight: bold; color: var(--walmart-navy); }
.assoc-name { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; padding-right: 10px; }
.assoc-val { text-align: right; min-width: 20%; }
.box-pickers    { top: 30.5%; left: 4.5%;  width: 18%; height: 58%; }
.box-dispensers { top: 30.5%; left: 23.8%; width: 18%; height: 58%; }
.box-stagers    { top: 30.5%; left: 43.1%; width: 18%; height: 28%; }
.box-preppers   { top: 60.5%; left: 43.1%; width: 18%; height: 28%; }

/* Title slide: text-only overlays positioned over the blank background's banner and fact box. */
.title-banner {
  position: absolute;
  left: 9.6%;
  top: 73.7%;
  width: 48.4%;
  height: 10.3%;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
}
.banner-text {
  position: relative;
  display: inline-block;
  white-space: nowrap;
  color: #1456a6;
  font-family: 'Bogle', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 800;
  font-size: 3.7em;
  padding-left: 0;
}
.fact-box {
  position: absolute;
  left: 64.6%;
  top: 36%;
  width: 32.3%;
  height: 58.4%;
  box-sizing: border-box;
  z-index: 2;
  display: flex;
  flex-direction: column;
  padding: 3em 2.4em 2.4em 2.6em;
  color: #fff;
  font-family: 'Bogle', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
.fact-title { font-size: 2.6em; font-weight: 800; line-height: 1.15; margin-bottom: .3em; overflow-wrap: anywhere; }
.fact-text { flex: 1; min-height: 0; overflow: hidden; font-size: 2.3em; line-height: 1.2; font-weight: 500; white-space: pre-line; overflow-wrap: anywhere; }

.control-group textarea {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font: inherit;
  font-size: 15px;
  box-sizing: border-box;
  width: 100%;
  resize: vertical;
}
.control-group textarea:focus { outline: none; border-color: var(--walmart-blue); box-shadow: 0 0 0 2px rgba(0,113,206,.2); }
.controls-grid.fact-grid:not(.assoc-grid) { grid-template-columns: 1fr; }
.secondary-btn {
  align-self: flex-start;
  background: #fff;
  color: var(--walmart-blue);
  border: 2px solid var(--walmart-blue);
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}
.secondary-btn:hover { background: #e6f1fb; }

/* FY calendar picker */
.week-picker { position: relative; display: flex; align-items: center; gap: 8px; }
.cal-btn {
  border: 1px solid #ccc;
  background: #f8f9fa;
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 16px;
  cursor: pointer;
}
.cal-btn:hover, .cal-btn[aria-expanded="true"] { background: #e6f1fb; border-color: var(--walmart-blue); }
.cal-popup {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: min(340px, 90vw);
  background: #fff;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
  z-index: 50;
  overflow: hidden;
}
.cal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--walmart-blue);
  color: #fff;
  padding: 10px 12px;
  font-weight: bold;
}
.cal-head button {
  background: rgba(255,255,255,.2);
  color: #fff;
  border: 0;
  border-radius: 4px;
  width: 32px;
  height: 28px;
  font-size: 16px;
  cursor: pointer;
}
.cal-head button:hover { background: rgba(255,255,255,.35); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 10px;
  max-height: 340px;
  overflow-y: auto;
}
.cal-week {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  background: #fafafa;
  color: var(--walmart-navy);
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}
.cal-week small { font-size: 10px; font-weight: normal; color: #555; white-space: nowrap; }
.cal-week:hover { border-color: var(--walmart-blue); background: #e6f1fb; }
.cal-week.today { border-color: var(--walmart-yellow); box-shadow: inset 0 0 0 2px var(--walmart-yellow); }
.cal-week.selected { background: var(--walmart-blue); border-color: var(--walmart-blue); color: #fff; }
.cal-week.selected small { color: #fff; }

/* Customer Shoutouts Slide */
.shoutout-text {
  position: absolute;
  z-index: 2;
  box-sizing: border-box;
  padding: 0.25em 0.45em;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--walmart-navy);
  font-family: 'Bogle', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 800;
  line-height: 1.18;
  overflow: hidden;
  word-break: break-word;
  overflow-wrap: anywhere;
  white-space: pre-line;
}
.shoutout-badge {
  position: absolute;
  z-index: 3;
  box-sizing: border-box;
  padding: 0 0.2em;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #ffffff;
  font-family: 'Bogle', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 800;
  font-size: 2.05em;
  letter-spacing: -0.02em;
  line-height: 1;
  white-space: nowrap;
}
.shoutout-card {
  background: #fff;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.shoutout-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.shoutout-card-head label {
  font-size: 14px;
  font-weight: bold;
  color: var(--walmart-navy);
}
.shoutout-card-head input {
  width: 110px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: bold;
  text-align: center;
}

/* Toast */
#toast {
  visibility: hidden;
  min-width: 250px;
  background: #f44336;
  color: #fff;
  text-align: center;
  border-radius: 6px;
  padding: 16px 24px;
  position: fixed;
  z-index: 1000;
  left: 50%;
  top: 20px;
  transform: translateX(-50%);
  font-size: 16px;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
  font-weight: bold;
  opacity: 0;
  transition: opacity .3s, top .3s;
}
#toast.show { visibility: visible; opacity: 1; top: 70px; }
</style>
</head>
<body>
  <div id="toast" role="alert"></div>

  <button id="installBanner" type="button" class="install-banner" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    Tap here to Install App to Home Screen
  </button>

  <div class="toolbar">
    <img id="toolbar-logo" src="555.jpg" class="toolbar-logo" alt="Slide Metrics">
  </div>

  <div class="controls-container">
    <div class="panel">
      <div class="panel-row">
        <label for="viewSelect">Slide Selection:</label>
        <select id="viewSelect">
          <option value="fulfillment" selected>Fulfillment Metrics</option>
          <option value="department">Department Metrics</option>
          <option value="associate">Associate Performance</option>
          <option value="shoutouts">Customer Shoutouts</option>
          <option value="title">Title Slide</option>
        </select>
      </div>
      <div class="panel-row" id="titleBgRow" hidden>
        <label for="title-bg-select">Background:</label>
        <select id="title-bg-select"></select>
      </div>
      <div class="panel-row" id="shoutoutsThemeRow" hidden>
        <label for="shoutouts-theme-select">Theme:</label>
        <select id="shoutouts-theme-select">
          <option value="none" selected>None</option>
          <option value="harvest">Harvest</option>
        </select>
      </div>
      <div class="panel-row" id="shoutoutsBgRow" hidden>
        <label for="shoutouts-bg-select">Background:</label>
        <select id="shoutouts-bg-select"></select>
      </div>
      <div class="panel-row" id="titleStoreRow" hidden>
        <label for="title-store-input">Store Number:</label>
        <input type="text" id="title-store-input" inputmode="numeric" style="width:120px">
      </div>
      <div class="panel-row">
        <label for="weekInput">Week Number:</label>
        <div class="week-picker">
          <button id="calBtn" type="button" class="cal-btn" aria-label="Open Walmart FY calendar" aria-expanded="false">📅</button>
          <input type="text" id="weekInput" placeholder="e.g. 23" inputmode="numeric" style="width:120px">
          <div id="calPopup" class="cal-popup" hidden></div>
        </div>
      </div>
      <div class="panel-row">
        <label for="fyDateInput">Walmart FY Date:</label>
        <input type="text" id="fyDateInput" placeholder="Auto-calculated" style="width:180px">
      </div>
      <button id="exportBtn" type="button" class="export-btn">Export as JPG</button>
    </div>

    <div id="controls-fulfillment" data-view-controls>
      <details open><summary>Performance Overview</summary><div class="controls-grid" id="perfControls"></div></details>
      <details><summary>Target Goals</summary><div class="controls-grid" id="goalControls"></div></details>
    </div>
    <div id="controls-title" data-view-controls hidden>
      <details open><summary>Fact</summary><div class="controls-grid fact-grid" id="factControls"></div></details>
    </div>
    <div id="controls-department" data-view-controls hidden>
      <details open><summary>Department Metrics</summary><div class="controls-grid" id="deptControls"></div></details>
    </div>
    <div id="controls-associate" data-view-controls hidden>
      <details open><summary>Top Pickers</summary><div class="controls-grid assoc-grid" id="assoc-pickers-controls"></div></details>
      <details><summary>Top Dispensers</summary><div class="controls-grid assoc-grid" id="assoc-dispensers-controls"></div></details>
      <details><summary>Top Stagers</summary><div class="controls-grid" id="assoc-stagers-controls"></div></details>
      <details><summary>Top Preppers</summary><div class="controls-grid" id="assoc-preppers-controls"></div></details>
    </div>
    <div id="controls-shoutouts" data-view-controls hidden>
      <details open><summary>Customer Shoutouts (7 Speech Bubbles)</summary><div class="controls-grid fact-grid" id="shoutoutsControls"></div></details>
    </div>
  </div>

  <div class="responsive-viewer">
    <div class="container" id="titleContainer" data-view-container hidden>
      <img id="title-bg" class="bg-image" alt="">
      <div id="titleBanner" class="title-banner">
        <span id="titleBannerText" class="banner-text"></span>
      </div>
      <div class="fact-box">
        <div id="factTitle" class="fact-title"></div>
        <div id="factText" class="fact-text"></div>
      </div>
    </div>

    <div class="container" id="fulfillmentContainer" data-view-container>
      <img id="fulfillment-bg" class="bg-image" alt="">
      <div class="week-display"></div>
      <div id="leftGrid" class="dashboard-grid left-side"></div>
      <div id="rightGrid" class="dashboard-grid right-side"></div>
    </div>

    <div class="container" id="departmentContainer" data-view-container hidden>
      <img id="department-bg" class="bg-image" alt="">
      <div class="week-display"></div>
      <div id="deptGrid" class="dept-grid"></div>
    </div>

    <div class="container" id="associateContainer" data-view-container hidden>
      <img id="associate-bg" class="bg-image" alt="">
      <div class="week-display"></div>
      <div class="assoc-header">Top Performing Associates</div>
      <div id="assoc-pickers" class="assoc-box box-pickers"></div>
      <div id="assoc-dispensers" class="assoc-box box-dispensers"></div>
      <div id="assoc-stagers" class="assoc-box box-stagers"></div>
      <div id="assoc-preppers" class="assoc-box box-preppers"></div>
    </div>

    <div class="container" id="shoutoutsContainer" data-view-container hidden>
      <img id="shoutouts-bg" class="bg-image" alt="">
      <div id="shoutoutsOverlay"></div>
    </div>

async function loadFacts() {
  try {
    const res = await fetch(`${FACTS_URL}?v=${APP_VERSION}&t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const list = (Array.isArray(data) ? data : data.facts || [])
      .filter(f => typeof f === "string" && f.trim());
    if (!list.length) throw new Error("no facts in file");
    FACTS = list;
    factDeck = [];
  } catch (err) {
    console.warn(`Could not load ${FACTS_URL}; using the built-in fallback facts.`, err);
  }
}
let factDeck = [];
function nextFact() {
  if (!factDeck.length) {
    factDeck = FACTS.filter(f => f !== state.title.fact);
    for (let i = factDeck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [factDeck[i], factDeck[j]] = [factDeck[j], factDeck[i]];
    }
  }
  return factDeck.pop() ?? FACTS[0];
}

const $ = id => document.getElementById(id);

const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function sanitizeNumber(raw) {
  const val = raw.replace(/[^0-9.]/g, "");
  const [head, ...rest] = val.split(".");
  return rest.length ? `${head}.${rest.join("")}` : val;
}

function parseValue(text) {
  const m = /\d+(\.\d+)?/.exec(text);
  return m ? parseFloat(m[0]) : 0;
}

/** Formats a raw value for display; returns "" for empty input. */
function formatValue(type, text) {
  if (text === "") return "";
  switch (type) {
    case "percent":  return `${text}%`;
    case "currency": return `$${text}`;
    case "time": {
      const [mins = "0", secs = "00"] = text.split(".");
      return `${mins || "0"} Min ${secs.padEnd(2, "0")} Sec`;
    }
    default: return text;
  }
}

function getColor(value, target, type) {
  const diff = type === "time" ? target - value : value - target; // positive = good
  if (diff >= 0) return "#1ae81a";
  if (diff >= -2) return "#ffc107";
  if (diff >= -4) return "#ff9800";
  return "#f44336";
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

/** Loads an image as a data URL when served over HTTP(S) so html2canvas never taints the canvas. */
async function loadImage(img, src, fallback = PLACEHOLDER_IMG) {
  img.onerror = () => {
    img.onerror = null;
    img.removeAttribute("crossorigin");
    img.src = fallback;
  };
  if (location.protocol === "http:" || location.protocol === "https:") {
    try {
      const res = await fetch(src);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      img.src = await blobToDataUrl(await res.blob());
      return;
    } catch {
      img.crossOrigin = "anonymous";
    }
  }
  img.src = src;
}

function createField({ label, type = "text", value = "", numeric = false, readOnly = false, id, onInput }) {
  const group = document.createElement("div");
  group.className = "control-group";

  const input = document.createElement("input");
  input.type = "text";
  if (numeric) input.inputMode = "decimal";
  if (id) input.id = id;
  input.value = value;
  input.readOnly = readOnly;
  input.addEventListener("input", () => {
    if (numeric) input.value = sanitizeNumber(input.value);
    state.dirty = true;
    onInput(input.value);
  });

  let control = input;
  if (type === "percent" || type === "currency") {
    control = document.createElement("div");
    control.className = "input-wrapper" + (type === "currency" ? " has-prefix" : "");
    const sym = document.createElement("span");
    sym.className = type === "currency" ? "input-prefix" : "input-suffix";
    sym.textContent = type === "currency" ? "$" : "%";
    control.append(...(type === "currency" ? [sym, input] : [input, sym]));
  }

  const lab = document.createElement("label");
  lab.textContent = label;
  group.append(lab, control);
  return group;
}

function initControls() {
  METRICS.forEach((m, i) => {
    $("perfControls").append(createField({
      label: m.name, type: m.type, numeric: true, value: state.perf[i],
      onInput: v => { state.perf[i] = v; renderFulfillment(); }
    }));
    if (!m.noGoalInput) {
      $("goalControls").append(createField({
        label: m.name, type: m.type, numeric: true, value: state.goals[i],
        onInput: v => { state.goals[i] = v; renderFulfillment(); }
      }));
    }
  });

  DEPT_METRICS.forEach((d, i) => {
    if (d.type === "placeholder") return;
    $("deptControls").append(createField({
      label: d.name, type: d.type, numeric: true, readOnly: !!d.computed,
      id: `dept-input-${i}`, value: state.dept[i],
      onInput: v => { state.dept[i] = v; updateHeadcount(); renderDept(); }
    }));
  });

  ASSOC_GROUPS.forEach(g => {
    const box = $(`assoc-${g.key}-controls`);
    state.assoc[g.key].forEach((item, i) => {
      const optional = i >= g.required;
      const wrap = document.createElement("div");
      wrap.className = "control-group";

      const lab = document.createElement("label");
      lab.textContent = `#${i + 1}${optional ? " (Optional)" : ""}`;

      const stack = document.createElement("div");
      stack.className = "stack";
      const name = document.createElement("input");
      name.type = "text";
      name.placeholder = "Associates Name";
      const val = document.createElement("input");
      val.type = "text";
      val.inputMode = "decimal";
      val.placeholder = g.valueLabel;

      for (const [el, field] of [[name, "name"], [val, "value"]]) {
        el.addEventListener("input", () => {
          state.dirty = true;
          item[field] = el.value;
          renderAssoc();
        });
      }
      stack.append(name, val);
      wrap.append(lab, stack);
      box.append(wrap);
    });
  });
}

/* ---------------- Rendering ---------------- */

function gaugeSvg(text, color, fillPercent) {
  const offset = ARC_LENGTH * (1 - fillPercent / 100);
  return `
    <svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
      <path d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke="#e2e2e2" stroke-width="25"/>
      <path d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke="${color}" stroke-width="25"
            stroke-dasharray="${ARC_LENGTH}" stroke-dashoffset="${offset}"/>
      <text x="100" y="85" dominant-baseline="middle" text-anchor="middle" font-weight="bold"
            font-size="28" font-family="Arial, sans-serif" fill="#000">${escapeHtml(text)}</text>
    </svg>`;
}

function textSvg(text, type, color) {
  const y = type === "time" ? 65 : 85;
  const fill = type === "time" ? color : "#000";
  return `
    <svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
      <text x="100" y="${y}" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
            fill="${fill}" text-anchor="middle" dominant-baseline="middle">${escapeHtml(text)}</text>
    </svg>`;
}

function metricSvg(type, text, color, fillPercent) {
  return type === "percent" ? gaugeSvg(text, color, fillPercent) : textSvg(text, type, color);
}

function renderFulfillment() {
  const left = $("leftGrid"), right = $("rightGrid");
  left.replaceChildren();
  right.replaceChildren();

  METRICS.forEach((m, i) => {
    const raw = state.perf[i];
    const goalRaw = state.goals[i];

    // Performance side: stay neutral (no color) until a value is entered.
    const value = parseValue(raw);
    const color = raw === "" ? "#e2e2e2" : getColor(value, parseValue(goalRaw), m.type);
    const fill = raw === "" ? 0 : Math.min(Math.max(value, 0), 100);
    const lCell = document.createElement("div");
    lCell.className = "graph-cell";
    lCell.innerHTML = metricSvg(m.type, formatValue(m.type, raw), color, fill);
    left.append(lCell);

    // Goal side
    const rCell = document.createElement("div");
    rCell.className = "graph-cell";
    if (goalRaw !== "") {
      rCell.innerHTML = metricSvg(m.type, formatValue(m.type, goalRaw), "#1ae81a", 100);
    }
    right.append(rCell);
  });
}

/** Dynamically scales each speech bubble's font size to maximize readability while fitting long surveys. */
function fitShoutouts() {
  const container = $("shoutoutsContainer");
  if (!container || container.hidden) return;

  container.querySelectorAll(".shoutout-text").forEach(el => {
    if (!el.textContent.trim()) return;
    let size = 1.95;
    el.style.fontSize = `${size}em`;
    while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && size > 0.55) {
      size = +(size - 0.04).toFixed(2);
      el.style.fontSize = `${size}em`;
    }
  });

  container.querySelectorAll(".shoutout-badge").forEach(el => {
    if (!el.textContent.trim()) return;
    let size = 2.05;
    el.style.fontSize = `${size}em`;
    while (el.scrollWidth > el.clientWidth && size > 1.35) {
      size = +(size - 0.05).toFixed(2);
      el.style.fontSize = `${size}em`;
    }
  });
}

/* ---------------- Week / FY date ---------------- */

const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

/** Saturday on or before Feb 1 of the given calendar year = first day of that fiscal year's week 1. */
function fyStartDate(startYear) {
  const feb1 = new Date(startYear, 1, 1);
  return new Date(startYear, 1, 1 - ((feb1.getDay() + 1) % 7));
}

/** Calendar year in which the fiscal year containing `today` started. */
function currentFYStartYear(today = new Date()) {
  const y = today.getFullYear();
  if (today.getMonth() === 0) return y - 1;
  // Early Feb days can still belong to the prior FY if week 1 hasn't begun yet.
  return today < fyStartDate(y) ? y - 1 : y;
}

const fyCodeFor = startYear => `FY${String((startYear + 1) % 100).padStart(2, "0")}`;

/** 52 or 53, depending on when the next fiscal year starts. */
function weeksInFY(startYear) {
  return Math.round((fyStartDate(startYear + 1) - fyStartDate(startYear)) / 604800000);
}

function fyWeekRange(startYear, num) {
  const s = fyStartDate(startYear);
  const start = new Date(s.getFullYear(), s.getMonth(), s.getDate() + (num - 1) * 7);
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
  return { start, end };
}

const fmtMD = d => `${MONTHS[d.getMonth()]} ${d.getDate()}`;

/** Returns e.g. "FY27 (Feb 1 - Feb 7)". Weeks run Saturday–Friday; week 1 is the week containing Feb 1. */
function getWalmartFYWeek(weekNum, startYear = currentFYStartYear()) {
  const num = parseInt(weekNum, 10);
  if (!(num >= 1 && num <= weeksInFY(startYear))) return "";
  const { start, end } = fyWeekRange(startYear, num);
  return `${fyCodeFor(startYear)} (${fmtMD(start)} - ${fmtMD(end)})`;
}

/** Fills the Title Slide date banner from the selected week, e.g. "10-31 – 11-6". Still editable afterwards. */
function syncTitleDate() {
  const num = parseInt(state.week, 10);
  const yr = state.fyStartYear ?? currentFYStartYear();
  if (!(num >= 1 && num <= weeksInFY(yr))) {
    state.title.date = "";
  } else {
    const { start, end } = fyWeekRange(yr, num);
    const f = d => `${d.getMonth() + 1}-${d.getDate()}`;
    state.title.date = `${f(start)} – ${f(end)}`;
  }
  syncFyDateInput();
  syncShoutoutDates();
  renderTitle();
}

function syncShoutoutDates() {
  const num = parseInt(state.week, 10);
  const yr = state.fyStartYear ?? currentFYStartYear();
  const validWeek = num >= 1 && num <= weeksInFY(yr);
  const weekStart = validWeek ? fyWeekRange(yr, num).start : null;

  state.shoutouts.forEach((item, i) => {
    if (item.dateAuto) {
      let dayStr = "";
      if (weekStart) {
        const d = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i);
        dayStr = `${d.getMonth() + 1}/${d.getDate()}`;
      }
      item.date = dayStr;
      const input = $(`shoutout-date-${i}`);
      if (input) input.value = dayStr;
    }
  });
  renderShoutouts();
}

function syncFyDateInput() {
  $("fyDateInput").value = currentView() === "title" ? state.title.date : state.fyDate;
}

/** The most recently completed fiscal week (the week before the current one), rolling back a fiscal year if needed. */
function lastFiscalWeek(today = new Date()) {
  let year = currentFYStartYear(today);
  const midnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const days = Math.round((midnight - fyStartDate(year)) / 86400000);
  let week = Math.floor(days / 7); // current week number is floor(days/7)+1, so last week is floor(days/7)
  if (week < 1) {
    year -= 1;
    week = weeksInFY(year);
  }
  return { year, week };
}

/** Sets week number + FY date together (used by the calendar picker). */
function setWeek(num, startYear) {
  state.week = String(num);
  state.fyDate = getWalmartFYWeek(num, startYear);
  state.fyStartYear = startYear;
  state.dirty = true;
  $("weekInput").value = state.week;
  renderWeekDisplay();
  syncTitleDate();
}

/* ---------------- FY calendar picker ---------------- */

const calendar = { year: null };

function renderCalendar() {
  const popup = $("calPopup");
  const year = calendar.year;
  const total = weeksInFY(year);
  const now = new Date();
  const selectedYear = state.fyStartYear ?? currentFYStartYear();

  // In the current fiscal year, list: last week, this week, upcoming weeks, then older past weeks (oldest first, so the newest past week is last).
  let order = Array.from({ length: total }, (_, i) => i + 1);
  const curWeek = order.find(n => {
    const { start, end } = fyWeekRange(year, n);
    return now >= start && now < new Date(end.getFullYear(), end.getMonth(), end.getDate() + 1);
  });
  if (curWeek) {
    const head = [curWeek - 1, curWeek].filter(n => n >= 1);
    const upcoming = order.filter(n => n > curWeek);
    const older = order.filter(n => n < curWeek - 1);
    order = [...head, ...upcoming, ...older];
  }

  popup.innerHTML = `
    <div class="cal-head">
      <button type="button" data-nav="-1" aria-label="Previous fiscal year">‹</button>
      <span>${fyCodeFor(year)} · ${total} weeks</span>
      <button type="button" data-nav="1" aria-label="Next fiscal year">›</button>
    </div>
    <div class="cal-grid">
      ${order.map(n => {
        const { start, end } = fyWeekRange(year, n);
        const classes = ["cal-week"];
        if (n === curWeek) classes.push("today");
        if (String(n) === state.week && year === selectedYear) classes.push("selected");
        return `<button type="button" class="${classes.join(" ")}" data-week="${n}">Wk ${n}<small>${fmtMD(start)} - ${fmtMD(end)}</small></button>`;
      }).join("")}
    </div>`;
}

function toggleCalendar(open) {
  const popup = $("calPopup");
  const show = open ?? popup.hidden;
  if (show) {
    calendar.year = state.fyStartYear ?? currentFYStartYear();
    renderCalendar();
  }
  popup.hidden = !show;
  $("calBtn").setAttribute("aria-expanded", String(show));
}

function initCalendar() {
  $("calBtn").addEventListener("click", e => { e.stopPropagation(); toggleCalendar(); });
  $("calPopup").addEventListener("click", e => {
    e.stopPropagation();
    const nav = e.target.closest("[data-nav]");
    if (nav) {
      calendar.year += Number(nav.dataset.nav);
      renderCalendar();
      return;
    }
    const wk = e.target.closest("[data-week]");
    if (wk) {
      setWeek(Number(wk.dataset.week), calendar.year);
      toggleCalendar(false);
    }
  });
  document.addEventListener("click", () => toggleCalendar(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape") toggleCalendar(false); });
}

/* ---------------- Export ---------------- */

/** Returns an error message, or "" if the active view is ready to export. */
function validateExport(view) {
  if (view !== "title" && view !== "shoutouts" && $("weekInput").value.trim() === "") return "Please enter a Week Number before exporting.";

  if (view === "title") {
    const t = state.title;
    if (!t.date.trim() || !t.store.trim() || !t.fact.trim()) return "Please fill in the Walmart FY Date, Store Number and Fact.";
  } else if (view === "shoutouts") {
    const hasAny = state.shoutouts.some(s => s.text.trim() !== "");
    if (!hasAny) return "Please enter at least one Customer Shoutout before exporting.";
  } else if (view === "fulfillment") {
    const goalsNeeded = METRICS.map((m, i) => (m.noGoalInput ? "x" : state.goals[i]));
    if ([...state.perf, ...goalsNeeded].some(v => v.trim() === "")) return "Please fill in all Fulfillment Metrics & Goals.";
  } else if (view === "department") {
    const missing = DEPT_METRICS.some((d, i) => d.type !== "placeholder" && state.dept[i].trim() === "");
    if (missing) return "Please fill in all Department Metrics.";
  } else {
    const incomplete = ASSOC_GROUPS.some(g =>
      state.assoc[g.key].slice(0, g.required).some(a => a.name.trim() === "" || a.value.trim() === ""));
    if (incomplete) return "Please fill in all Required Top Performers (Top 5 for Pickers/Dispensers, and all Stagers/Preppers).";
  }
  return "";
}

function sanitizeFilenamePart(str) {
  return str
    .replace(/[()]/g, "")
    .replace(/[\/\\:*?"<>|]/g, "")
    .trim()
    .replace(/\s*[–-]\s*/g, "-")
    .replace(/([A-Za-z]+)\s+(\d+)/g, "$1$2")
    .replace(/\s+/g, "_");
}

function buildExportName(view) {
  let suffix = "";
  if (view === "title") {
    const storeClean = sanitizeFilenamePart(state.title.store);
    const dateClean = sanitizeFilenamePart(state.title.date);
    if (storeClean) suffix += `_Store${storeClean}`;
    if (dateClean) suffix += `_${dateClean}`;
  } else {
    if (state.week) suffix += `_WK${state.week}`;
    const clean = sanitizeFilenamePart(state.fyDate);
    if (clean) suffix += `_${clean}`;
  }
  return `${VIEWS[view].file}${suffix}.jpg`;
}

async function exportGraphic() {
  const view = currentView();
  const error = validateExport(view);
  if (error) return showToast(error);

  const btn = $("exportBtn");
  const container = $(VIEWS[view].container);
  const saved = container.getAttribute("style") || "";
  btn.disabled = true;

  try {
    // Temporarily pin the slide to a fixed size so the export is identical on every device.
    const { width, height } = EXPORT_SIZE;
    Object.assign(container.style, {
      width: `${width}px`, maxWidth: `${width}px`, minWidth: `${width}px`,
      height: `${height}px`, minHeight: `${height}px`, aspectRatio: "auto"
    });
    updateContainerFonts();
    await new Promise(r => setTimeout(r, 100));

    const canvas = await html2canvas(container, {
      scale: 2, useCORS: true, backgroundColor: "#ffffff", windowWidth: width, windowHeight: height
    });

    const link = document.createElement("a");
    link.download = buildExportName(view);
    link.href = canvas.toDataURL("image/jpeg", 0.9);
    link.click();
  } catch (err) {
    console.error(err);
    const msg = err && err.name === "SecurityError"
      ? "Browser blocked local image export. Re-select the background image using the file picker at the bottom."
      : "Export failed. Please try again.";
    showToast(msg);
  } finally {
    // Always restore layout, even if html2canvas throws.
    container.setAttribute("style", saved);
    updateContainerFonts();
    btn.disabled = false;
  }
}

/* ---------------- Uploads, PWA, updates ---------------- */

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    $(VIEWS[currentView()].bg).src = e.target.result;
    event.target.value = "";
  };
  reader.readAsDataURL(file);
}

async function checkForUpdates() {
  try {
    const url = location.href.split("?")[0];
    const res = await fetch(`${url}?nocache=${Date.now()}`, { cache: "no-store" });
    const text = await res.text();
    const match = /const APP_VERSION\s*=\s*["']([^"']+)["']/.exec(text);
    if (match && match[1] !== APP_VERSION) {
      if (state.dirty) {
        showToast("A new version is available. Reload when you're done editing.");
      } else {
        location.replace(`${url}?v=${match[1]}`);
      }
    }
  } catch {
    console.warn("Could not check for updates (offline or network issue).");
  }
}

function initPWA() {
  const banner = $("installBanner");
  if (deferredPrompt) banner.hidden = false;

  banner.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.hidden = true;
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(err =>
      console.log("Service Worker registration failed (ensure sw.js exists):", err));
  }
}

/* ---------------- Init ---------------- */

function init() {
  loadStaticImages();
  initControls();
  initTitleControls();
  initShoutoutsControls();
  // Once facts.json arrives, swap the starting fact for one from it (unless the user already typed their own).
  loadFacts().then(() => {
    if (!state.title.factAuto) return;
    const wasDirty = state.dirty;
    setFact(nextFact());
    state.dirty = wasDirty;
  });
  renderFulfillment();
  renderDept();
  renderAssoc();
  renderTitle();
  renderShoutouts();

  // Default every slide to last week's dates (can still be changed via the calendar or by typing).
  const last = lastFiscalWeek();
  setWeek(last.week, last.year);
  state.dirty = false;

  toggleView();

  $("viewSelect").addEventListener("change", toggleView);
  $("exportBtn").addEventListener("click", exportGraphic);
  $("imageUpload").addEventListener("change", handleImageUpload);

  $("weekInput").addEventListener("input", e => {
    state.week = e.target.value.replace(/[^0-9]/g, "");
    e.target.value = state.week;
    state.fyStartYear = null;
    state.fyDate = state.week ? getWalmartFYWeek(state.week) : "";
    state.dirty = true;
    renderWeekDisplay();
    syncTitleDate();
  });
  $("fyDateInput").addEventListener("input", e => {
    state.dirty = true;
    if (currentView() === "title") {
      state.title.date = e.target.value;
      renderTitle();
    } else {
      state.fyDate = e.target.value;
      renderWeekDisplay();
    }
  });

  initPWA();
  initCalendar();
  checkForUpdates();
  setInterval(checkForUpdates, 60 * 60 * 1000);
  window.addEventListener("resize", updateContainerFonts);
}

window.addEventListener("load", init);
</script>
